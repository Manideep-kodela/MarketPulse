
name: Build MarketPulse Complete Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'MarketPulseAndroid_Complete_Release.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract complete project
        run: |
          unzip -q MarketPulseAndroid_Complete_Release.zip
          ls -la MarketPulseAndroid

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build complete APK
        working-directory: MarketPulseAndroid/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketPulse-Complete-APK
          path: MarketPulseAndroid/android/app/build/outputs/apk/debug/app-debug.apk
          
