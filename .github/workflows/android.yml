
name: Build MarketPulse Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MarketPulseAndroid_Starter.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q MarketPulseAndroid_Starter.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
          accept-android-sdk-licenses: true

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("MarketPulseAndroid/android/app/build.gradle.kts")
          content = path.read_text()

          old = "    buildFeatures { compose = true }"
          new = """    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions {
              jvmTarget = "17"
          }
          buildFeatures { compose = true }"""

          if old not in content:
              raise SystemExit("Could not find expected Gradle configuration")

          path.write_text(content.replace(old, new, 1))
          print("Java and Kotlin targets updated to 17")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: MarketPulseAndroid/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketPulse-debug-APK
          path: MarketPulseAndroid/android/app/build/outputs/apk/debug/app-debug.apk
